<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"><title>AR</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script><!--A-Frame（バージョン1.4.2）-->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script><!--AR.js(A-Frame上でのカメラなど)-->
  <style>
  /*デバッグメニューレイアウト 画面の左上（上から10px、左から10px）の位置に固定 背景を少し透けた黒色 文字の色を蛍光の黄緑色枠線 文字の間に10pxの余白 最前面表示 プログラム内の改行を、実際の画面上でもそのまま改行*/
  #debug{
    position:fixed;top:10px;left:10px;background:rgba(0,0,0,.7);color:#0f0;padding:10px;z-index:9999;white-space:pre-line
  }
    </style>
  </head>
    <body>
      <div id="debug">GPS取得待機中...</div><!--デバッグメニューの初期状態-->
   
    <!--GPSと連動 ジャイロ読み取りカメラ追従 10000m以上のオブジェクト、0.1m以内のオブジェクトを非表示-->           
   
    <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; gpsMinDistance:5; gpsTimeInterval:1000;">

    <a-camera
        gps-camera
        rotation-reader
        camera="far: 10000; near: 0.1">
    </a-camera>
            <!-- ここから51地点分の避難所 hinan.glbを指定座標に2mx2mx2mで表示-->

    <!--新発田城跡-->
    <a-entity gps-entity-place="latitude:37.93963891; longitude:139.326001834219947;"
        gltf-model="shibata_jyo.glb"
        scale="2 2 2"></a-entity>

    <!-- 清水園 -->
    <a-entity gps-entity-place="latitude:37.943791; longitude:139.328785;"
        gltf-model="kiyomizuen.glb"
        scale="2 2 2"></a-entity>

    <!-- 蔵春閣 -->
    <a-entity gps-entity-place="latitude:37.94389807273562; longitude:139.3317142467578;"
        gltf-model="Zousyunkaku.glb"
        scale="2 2 2"></a-entity>

    <!-- 東公園のSL -->
    <a-entity gps-entity-place="latitude:37.94367248807764; longitude:139.3323475293261;"
        gltf-model="SL.glb"
        scale="2 2 2"></a-entity>

    <!-- 諏訪神社 -->
    <a-entity gps-entity-place="latitude:37.944214; longitude:139.332004;"
        gltf-model="uwazinnzya.glb"
        scale="2 2 2"></a-entity>

    <!-- 新発田市役所 -->
    <a-entity gps-entity-place="latitude:37.947839; longitude:139.327160;"
        gltf-model="siyakusyo.glb"
        scale="2 2 2"></a-entity>

    <!-- 王紋酒造 -->
    <a-entity gps-entity-place="latitude:37.94436989072327; longitude:139.33066511399528;"
        gltf-model="Oumon.glb"
        scale="2 2 2"></a-entity>

    <!-- 五十公野公園 -->
    <a-entity gps-entity-place="latitude:37.939869; longitude:139.356680;"
        gltf-model="iziminino.glb"
        scale="2 2 2"></a-entity>

    <!-- カルチャーセンター -->
    <a-entity gps-entity-place="latitude:37.950246; longitude:139.338618;"
        gltf-model="karutya.glb"
        scale="2 2 2"></a-entity>

    <!-- 新発田駅 -->
    <a-entity gps-entity-place="latitude:37.94413; longitude:139.33510;"
        gltf-model="shibata_station.glb"
        scale="2 2 2"></a-entity>

    <!-- あやめの湯 -->
    <a-entity gps-entity-place="latitude:37.9339893; longitude:139.3871205;"
        gltf-model="ayame.glb"
        scale="2 2 2"></a-entity>

    <!-- イクネス -->
    <a-entity gps-entity-place="latitude:37.944357; longitude:139.333388;"
        gltf-model="ikunesu.glb"
        scale="2 2 2"></a-entity>

    <!-- 市民文化会館 -->
    <a-entity gps-entity-place="latitude:37.951722; longitude:139.326564;"
        gltf-model="simin.glb"
        scale="2 2 2"></a-entity>

    <!-- 新発田歴史図書館 -->
    <a-entity gps-entity-place="latitude:37.9512799091573; longitude:139.327747562921;"
        gltf-model="tosyokan.glb"
        scale="2 2 2"></a-entity>

    <!-- 旧新発田市市役所 -->
    <a-entity gps-entity-place="latitude:37.950883; longitude:139.327898;"
        gltf-model="kyusiyakusyo.glb"
        scale="2 2 2"></a-entity>

    <!-- 新潟職能短大 -->
    <a-entity gps-entity-place="latitude:37.955482; longitude139.338409;"
        gltf-model="daigaku.glb"
        scale="2 2 2"></a-entity>
    <!-- 菊水 -->
    <a-entity gps-entity-place="latitude:37.960376479226; longitude:139.354291358223;"
        gltf-model="Funaguchi.glb"
        scale="2 2 2"></a-entity>
</a-scene>
      <script>
        /*デバッグを取得 ブラウザにあるnavigator機能のgeolocationを監視する 情報を取得したらpにGPS情報を挿入 （）内は精度*/
        const d=document.getElementById('debug');
        navigator.geolocation.watchPosition(p=>{d.textContent=`現在位置
        緯度:${p.coords.latitude.toFixed(8)}
        経度:${p.coords.longitude.toFixed(8)}
        GPS精度:${p.coords.accuracy.toFixed(1)} m`;},
        /*GPS取得失敗時のメッセージ enableHighAccuracy:true高性能GPS timeout:10000GPS取得待機時間（10秒待っても読み込めなければエラー）*/
        e=>d.textContent=e.message,{enableHighAccuracy:true,maximumAge:0,timeout:10000});
    </script>
  </body>
</html>
