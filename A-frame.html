<script>
const d = document.getElementById("debug");

navigator.geolocation.watchPosition(
    function (p) {

        d.textContent =
`現在位置

緯度 : ${p.coords.latitude.toFixed(8)}
経度 : ${p.coords.longitude.toFixed(8)}
GPS精度 : ${p.coords.accuracy.toFixed(1)} m`;

    },

    function (e) {
        d.textContent = "GPS取得失敗\n" + e.message;
    },

    {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
    }
);

// GPSカメラが初期化されたか確認
window.addEventListener("gps-camera-update-position", function(e){
    console.log("GPS更新", e.detail.position);
});

window.addEventListener("camera-init", function () {
    console.log("カメラ初期化完了");
});

window.addEventListener("camera-error", function (e) {
    console.error("カメラエラー", e);
});
</script>
