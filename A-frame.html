<script src="collection-data.js"></script>

<script>

const debug =
  document.getElementById("debug");

const arrow =
  document.getElementById("directionArrow");

const arrowInfo =
  document.getElementById("arrowInfo");

const compassButton =
  document.getElementById("compassButton");

const compassToggle =
  document.getElementById("compassToggle");


/* ========================= */
/* 観光スポット一覧 */
/* ========================= */

const spots = [

  {
    id:"castle",
    name:"新発田城",
    lat:37.954824724542696,
    lng:139.326001834219947,
    model:"shibata_jyo.glb",
    scale:"1 1 1"
  },

  {
    id:"zousyunkaku",
    name:"蔵春閣",
    lat:37.94389807273562,
    lng:139.3317142467578,
    model:"Zousyunkaku.glb",
    scale:"1 1 1"
  },

  {
    id:"sl",
    name:"東公園のSL",
    lat:37.94367248807764,
    lng:139.3323475293261,
    model:"SL.glb",
    scale:"1 1 1"
  },

  {
    id:"oumon",
    name:"王紋酒造",
    lat:37.94436989072327,
    lng:139.33066511399528,
    model:"Oumon.glb",
    scale:"1 1 1"
  },

  {
    id:"station",
    name:"新発田駅",
    lat:37.94413,
    lng:139.33510,
    model:"shibata_station.glb",
    scale:"1 1 1"
  },

  {
    id:"menchi",
    name:"五十公野メンチカツや",
    lat:37.93682,
    lng:139.34488,
    model:"Menchikatsu.glb",
    scale:"1 1 1"
  },

  {
    id:"hellotore",
    name:"新潟職業能力開発短期大学校",
    lat:37.95588068,
    lng:139.3382848,
    model:"hellotore_kun.glb",
    scale:"1 1 1"
  }

];


/* ========================= */
/* 設定 */
/* ========================= */

const ACTIVE_RADIUS = 300;

const states = new Map();

let currentPosition = null;

let nearestSpot = null;

let nearestDistance = Infinity;

let currentHeading = null;

let compassVisible = true;


/* ========================= */
/* モデル読み込み状態 */
/* ========================= */

spots.forEach(spot => {

  const entity =
    document.getElementById(
      `model-${spot.id}`
    );

  states.set(
    spot.id,
    "読み込み中"
  );


  entity.addEventListener(
    "model-loaded",
    () => {

      states.set(
        spot.id,
        "読込成功"
      );

    }
  );


  entity.addEventListener(
    "model-error",
    e => {

      states.set(
        spot.id,
        "読込失敗"
      );

      console.error(
        spot.name,
        e.detail
      );

    }
  );

});


/* ========================= */
/* 緯度経度 → ラジアン */
/* ========================= */

function rad(v){

  return v * Math.PI / 180;

}


/* ========================= */
/* 2地点間の距離 */
/* ========================= */

function distanceMeters(
  lat1,
  lng1,
  lat2,
  lng2
){

  const R = 6371000;

  const dLat =
    rad(lat2 - lat1);

  const dLng =
    rad(lng2 - lng1);

  const a =
    Math.sin(dLat / 2) ** 2
    +
    Math.cos(rad(lat1))
    *
    Math.cos(rad(lat2))
    *
    Math.sin(dLng / 2) ** 2;

  return R * 2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

}


/* ========================= */
/* 最寄りモデルだけ表示 */
/* ========================= */

function showOnlyNearestModel(
  nearest,
  nearestDistance
){

  const activeId =
    nearestDistance <= ACTIVE_RADIUS
      ? nearest.id
      : null;


  spots.forEach(spot => {

    document
      .getElementById(
        `model-${spot.id}`
      )
      .setAttribute(
        "visible",
        spot.id === activeId
      );

  });


  return activeId;

}


/* ========================= */
/* 方位角を計算 */
/* ========================= */

function bearingDegrees(
  lat1,
  lng1,
  lat2,
  lng2
){

  const y =
    Math.sin(
      rad(lng2 - lng1)
    )
    *
    Math.cos(
      rad(lat2)
    );


  const x =
    Math.cos(
      rad(lat1)
    )
    *
    Math.sin(
      rad(lat2)
    )
    -
    Math.sin(
      rad(lat1)
    )
    *
    Math.cos(
      rad(lat2)
    )
    *
    Math.cos(
      rad(lng2 - lng1)
    );


  let bearing =
    Math.atan2(y, x)
    *
    180
    /
    Math.PI;


  bearing =
    (bearing + 360) % 360;


  return bearing;

}


/* ========================= */
/* 角度を -180 ～ 180 にする */
/* ========================= */

function normalizeAngle(angle){

  return (
    (angle + 540) % 360
  ) - 180;

}


/* ========================= */
/* 矢印の表示・非表示 */
/* ========================= */

function updateCompassVisibility(){

  if(compassVisible){

    arrow.setAttribute(
      "visible",
      true
    );

    arrowInfo.style.display =
      "block";

    compassToggle.textContent =
      "🧭 コンパスを非表示";

  }else{

    arrow.setAttribute(
      "visible",
      false
    );

    arrowInfo.style.display =
      "none";

    compassToggle.textContent =
      "🧭 コンパスを表示";

  }

}


/* ========================= */
/* 矢印を更新 */
/* ========================= */

function updateArrow(){

  if(
    !currentPosition ||
    !nearestSpot ||
    currentHeading === null
  ){

    arrow.setAttribute(
      "visible",
      false
    );

    return;

  }


  if(!compassVisible){

    arrow.setAttribute(
      "visible",
      false
    );

    return;

  }


  const targetBearing =
    bearingDegrees(

      currentPosition.lat,
      currentPosition.lng,

      nearestSpot.lat,
      nearestSpot.lng

    );


  const difference =
    normalizeAngle(
      targetBearing -
      currentHeading
    );


  /* ========================= */
  /* 矢印を左右に回転 */
  /* ========================= */

  arrow.setAttribute(
    "rotation",
    `0 0 ${-difference}`
  );


  arrow.setAttribute(
    "visible",
    true
  );


  /* ========================= */
  /* 方向表示 */
  /* ========================= */

  let directionText;


  if(
    Math.abs(difference) < 15
  ){

    directionText =
      "⬆ 正面";

  }else if(
    difference > 0 &&
    difference < 180
  ){

    directionText =
      "➡ 右";

  }else if(
    difference < 0 &&
    difference > -180
  ){

    directionText =
      "⬅ 左";

  }else{

    directionText =
      "⬇ 後ろ";

  }


  arrowInfo.textContent =
    `${directionText}\n` +
    `${nearestSpot.name}　` +
    `${nearestDistance.toFixed(1)}m`;

}


/* ========================= */
/* コンパス切り替え */
/* ========================= */

compassToggle.addEventListener(
  "click",
  () => {

    compassVisible =
      !compassVisible;

    updateCompassVisibility();

    updateArrow();

  }
);


/* ========================= */
/* iPhone コンパス許可 */
/* ========================= */

async function enableCompass(){

  try{

    if(
      typeof DeviceOrientationEvent !==
      "undefined"
      &&
      typeof DeviceOrientationEvent
        .requestPermission ===
        "function"
    ){

      const permission =
        await DeviceOrientationEvent
          .requestPermission();


      if(
        permission !==
        "granted"
      ){

        arrowInfo.textContent =
          "コンパスの許可が必要です";

        return;

      }

    }


    window.addEventListener(
      "deviceorientation",
      handleOrientation,
      true
    );


    compassButton.style.display =
      "none";


    compassToggle.style.display =
      "block";


    arrowInfo.textContent =
      "🧭 コンパス有効";


    updateCompassVisibility();

  }catch(error){

    console.error(error);

    arrowInfo.textContent =
      "コンパスを利用できません";

  }

}


compassButton.addEventListener(
  "click",
  enableCompass
);


/* ========================= */
/* スマホの向きを取得 */
/* ========================= */

function handleOrientation(event){

  let heading = null;


  /* iPhone Safari */
  if(
    typeof event.webkitCompassHeading ===
    "number"
    &&
    event.webkitCompassHeading >= 0
  ){

    heading =
      event.webkitCompassHeading;

  }

  /* Androidなど */
  else if(
    event.absolute === true
    &&
    typeof event.alpha ===
    "number"
  ){

    heading =
      360 - event.alpha;

  }


  if(heading !== null){

    currentHeading =
      (heading + 360) % 360;

    updateArrow();

  }

}


/* ========================= */
/* GPS取得 */
/* ========================= */

navigator.geolocation.watchPosition(

  p => {

    const lat =
      p.coords.latitude;

    const lng =
      p.coords.longitude;

    const accuracy =
      p.coords.accuracy;


    /* 現在位置を保存 */

    currentPosition = {

      lat:lat,
      lng:lng

    };


    /* ========================= */
    /* 一番近い観光地を探す */
    /* ========================= */

    nearestSpot = null;

    nearestDistance =
      Infinity;


    spots.forEach(spot => {

      const d =
        distanceMeters(

          lat,
          lng,

          spot.lat,
          spot.lng

        );


      if(
        d < nearestDistance
      ){

        nearestDistance =
          d;

        nearestSpot =
          spot;

      }

    });


    /* ========================= */
    /* モデル表示 */
    /* ========================= */

    const activeId =
      showOnlyNearestModel(
        nearestSpot,
        nearestDistance
      );


    const active =
      activeId
        ?
        `${nearestSpot.name}:` +
        `${states.get(activeId) ||
        "準備中"}`
        :
        "なし";


    /* ========================= */
    /* デバッグ表示 */
    /* ========================= */

    debug.textContent =

`現在位置
緯度:${lat.toFixed(8)}
経度:${lng.toFixed(8)}
GPS精度:${accuracy.toFixed(1)} m

最寄り:${nearestSpot
  ? nearestSpot.name
  : "-"}
距離:${nearestDistance < Infinity
  ? nearestDistance.toFixed(1)
  : "-"} m
設置座標:${nearestSpot
  ? `${nearestSpot.lat}, ${nearestSpot.lng}`
  : "-"}

300m以内のモデル
${active}`;


    /* ========================= */
    /* 矢印更新 */
    /* ========================= */

    updateArrow();

  },


  e => {

    debug.textContent =

`位置情報エラー
${e.message}`;

  },


  {
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:15000
  }

);

</script>

</body>
</html>
