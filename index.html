<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>しばコレ 3Dモデルビューア</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"
onerror="document.getElementById('status').textContent='3Dライブラリを読み込めません。ネット接続を確認してください。';">
</script>

<style>

* { box-sizing: border-box; }

:root {
  color-scheme: dark;
  --bg: #101a32;
  --panel: rgba(13, 23, 45, .92);
  --panel-border: rgba(148, 180, 255, .2);
  --surface: #1b2b4a;
  --surface-hover: #263c63;
  --text: #f4f7ff;
  --muted: #aab9d5;
  --accent: #78aaff;
  --accent-strong: #4d8dff;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Inter, "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 70% 18%, rgba(57, 93, 160, .18), transparent 42%),
    var(--bg);
}

model-viewer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  --poster-color: var(--bg);
}

#panel {
  position: fixed;
  z-index: 10;
  top: 18px;
  left: 18px;
  width: min(370px, calc(100% - 36px));
  max-height: calc(100% - 112px);
  overflow-y: auto;
  padding: 22px;
  border: 1px solid var(--panel-border);
  border-radius: 22px;
  background: var(--panel);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  scrollbar-width: thin;
  scrollbar-color: #405780 transparent;
}

#panel.hidden { display: none; }

h1 {
  margin: 0 0 5px;
  font-size: 21px;
  line-height: 1.4;
  font-weight: 750;
  letter-spacing: .02em;
}

#panel::before {
  content: "SHIBACOLLE  /  3D VIEWER";
  display: block;
  margin-bottom: 9px;
  color: var(--accent);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .17em;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: .03em;
  color: var(--muted);
}

select, button, input[type="file"] {
  width: 100%;
  min-height: 44px;
  border: 1px solid rgba(160, 184, 225, .22);
  border-radius: 12px;
  padding: 10px 12px;
  color: var(--text);
  background: var(--surface);
  font: inherit;
  font-size: 14px;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}

select { cursor: pointer; }
select:focus-visible, button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

input[type="range"] {
  width: 100%;
  margin: 7px 0 0;
  accent-color: var(--accent-strong);
  cursor: pointer;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 20px;
}

button {
  cursor: pointer;
  font-weight: 650;
}

button:hover, select:hover {
  background: var(--surface-hover);
  border-color: rgba(120, 170, 255, .65);
}

button:active { transform: scale(.985); }

#resetBtn {
  background: #243858;
}

#rotateBtn {
  border-color: rgba(120, 170, 255, .42);
  background: #24477b;
}

#status {
  margin-top: 18px;
  padding: 11px 12px;
  border: 1px solid rgba(120, 170, 255, .15);
  border-radius: 12px;
  background: rgba(7, 14, 29, .45);
  color: #bcd5ff;
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#togglePanel {
  position: fixed;
  z-index: 20;
  top: 18px;
  right: 18px;
  width: auto;
  min-height: 42px;
  padding: 9px 15px;
  border: 1px solid var(--panel-border);
  border-radius: 13px;
  background: rgba(13, 23, 45, .9);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: none;
}

#togglePanel.visible { display: block; }

#help {
  position: fixed;
  z-index: 5;
  bottom: 18px;
  left: 18px;
  right: 18px;
  width: fit-content;
  max-width: min(560px, calc(100% - 36px));
  padding: 11px 15px;
  border: 1px solid rgba(148, 180, 255, .16);
  border-radius: 14px;
  background: rgba(13, 23, 45, .78);
  color: #dce7ff;
  font-size: 12px;
  line-height: 1.75;
  pointer-events: none;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

#sizeValue {
  float: right;
  color: var(--accent);
  font-size: 12px;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 600px) {
  #panel {
    top: 10px;
    left: 10px;
    width: min(340px, calc(100% - 20px));
    max-height: calc(100% - 86px);
    padding: 17px;
    border-radius: 18px;
  }

  h1 { font-size: 18px; }
  label { margin-top: 15px; }

  #togglePanel {
    top: auto;
    right: 10px;
    bottom: 10px;
    min-height: 42px;
  }

  #help {
    left: 10px;
    right: 10px;
    bottom: 10px;
    max-width: calc(100% - 20px);
    padding: 9px 11px;
    font-size: 11px;
  }

  #panel:not(.hidden) ~ #help { display: none; }
}

</style>
</head>

<body>

<model-viewer
  id="viewer"
  alt="しばコレの3Dモデル"
  camera-controls
  touch-action="none"
  interaction-prompt="none"
  shadow-intensity="1"
  exposure="1.2"
  environment-image="neutral"
  loading="eager"
  reveal="auto"
  camera-orbit="35deg 70deg 105%">
</model-viewer>

<div id="panel">
  <h1>しばコレ 3Dモデルビューア</h1>

  <label for="modelSelect">モデルを選択</label>
  <select id="modelSelect">
    <option value="Zousyunkaku.glb">蔵春閣</option>
    <option value="hellotore_kun.glb">ハロトレくん</option>
    <option value="shibata_station.glb">新発田駅</option>
    <option value="shibata_suwa_shrine_gate.glb">諏訪神社の鳥居</option>
    <option value="shibatacastle.glb">新発田城</option>
    <option value="hinan.glb">避難誘導サイン</option>
  </select>

  <label for="sizeSlider">
    モデルの大きさ：<span id="sizeValue">100%</span>
  </label>
  <input id="sizeSlider" type="range"
         min="0.25" max="3" step="0.05" value="1">

  <div class="buttons">
    <button id="resetBtn">向きをリセット</button>
    <button id="rotateBtn">自動回転：OFF</button>
  </div>

  <label for="fileInput">別のGLBファイルを読み込む</label>
  <input id="fileInput" type="file" accept=".glb,.gltf">

  <div id="status">3Dライブラリを読み込んでいます...</div>
</div>

<button id="togglePanel" class="visible">設定を閉じる</button>

<div id="help">
  🖱 PC：ドラッグで回転・ホイールでズーム<br>
  📱 スマホ：スワイプで回転・ピンチでズーム<br>
  モデルが表示されない場合は、設定欄のエラーを確認してください。
</div>

<script>
(() => {
  const viewer = document.getElementById('viewer');
  const status = document.getElementById('status');
  const modelSelect = document.getElementById('modelSelect');
  const sizeSlider = document.getElementById('sizeSlider');
  const sizeValue = document.getElementById('sizeValue');
  const fileInput = document.getElementById('fileInput');
  const panel = document.getElementById('panel');
  const togglePanel = document.getElementById('togglePanel');
  const rotateBtn = document.getElementById('rotateBtn');

  let autoRotate = false;
  let localObjectURL = null;
  let currentSource = '';
  let loadVersion = 0;

  function setStatus(message, error = false) {
    status.textContent = message;
    status.style.color = error ? '#fca5a5' : '#93c5fd';
  }

  function setScale(value) {
    const n = Number(value);
    viewer.scale = `${n} ${n} ${n}`;
    sizeValue.textContent = `${Math.round(n * 100)}%`;
  }

  function loadModel(url, label) {
    const version = ++loadVersion;
    currentSource = url;
    setStatus('読み込み中：' + label);

    viewer.removeAttribute('src');
    viewer.src = url;
    viewer.alt = label;

    // 新しいモデルが読み込まれたかを区別するための識別子
    viewer.dataset.loadVersion = String(version);
  }

  viewer.addEventListener('load', () => {
    setStatus('表示成功：' + (fileInput.files[0]?.name ||
      modelSelect.options[modelSelect.selectedIndex].text));
    setScale(sizeSlider.value);
    viewer.updateFraming();
  });

  viewer.addEventListener('error', () => {
    setStatus(
      'モデルを読み込めませんでした。ファイル名、配置、GLB形式、通信状態を確認してください。',
      true
    );
  });

  viewer.addEventListener('progress', event => {
    if (event.detail.totalProgress < 1) {
      setStatus('モデルを読み込み中：' +
        Math.round(event.detail.totalProgress * 100) + '%');
    }
  });

  modelSelect.addEventListener('change', () => {
    if (localObjectURL) {
      URL.revokeObjectURL(localObjectURL);
      localObjectURL = null;
    }

    fileInput.value = '';
    setScale(1);
    loadModel(
      modelSelect.value,
      modelSelect.options[modelSelect.selectedIndex].text
    );
  });

  sizeSlider.addEventListener('input', () => {
    setScale(sizeSlider.value);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    viewer.cameraOrbit = '35deg 70deg 105%';
    viewer.cameraTarget = 'auto auto auto';
    viewer.updateFraming();
  });

  rotateBtn.addEventListener('click', () => {
    autoRotate = !autoRotate;

    if (autoRotate) {
      viewer.setAttribute('auto-rotate', '');
    } else {
      viewer.removeAttribute('auto-rotate');
    }

    rotateBtn.textContent = '自動回転：' +
      (autoRotate ? 'ON' : 'OFF');
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;

    if (localObjectURL) URL.revokeObjectURL(localObjectURL);
    localObjectURL = URL.createObjectURL(file);

    setScale(1);
    loadModel(localObjectURL, file.name);
  });

  togglePanel.addEventListener('click', () => {
    const hidden = panel.classList.toggle('hidden');
    togglePanel.textContent = hidden ? '設定を開く' : '設定を閉じる';
  });

  // ライブラリの準備を確認してからモデルを読み込む
  let attempts = 0;
  const waitForLibrary = setInterval(() => {
    attempts++;

    if (customElements.get('model-viewer')) {
      clearInterval(waitForLibrary);
      loadModel(modelSelect.value,
        modelSelect.options[modelSelect.selectedIndex].text);
    } else if (attempts >= 100) {
      clearInterval(waitForLibrary);
      setStatus(
        '3Dライブラリを読み込めません。ネット接続やブラウザの拡張機能を確認してください。',
        true
      );
    }
  }, 100);
})();
</script>

</body>
</html>
