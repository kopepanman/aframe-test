<body>

<a-scene

<a-entity id="model-castle" gps-entity-place="latitude:37.954824724542696;longitude:139.326001834219947;" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>

<a-entity id="model-zousyunkaku" gps-entity-place="latitude:37.94389807273562;longitude:139.3317142467578;" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>

<a-entity id="model-history-library" gps-entity-place="latitude:37.951279909157336;longitude:139.32774756292181;" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>

</a-scene>

<script src="collection-data.js"></script>
<script src="collection-tracker.js"></script>

<script>

const debug = document.getElementById("debug");

// =====================================
// 基本設定
// =====================================

const ACTIVE_RADIUS = 300;

// モデルの最大寸法（m）
const TARGET_MODEL_SIZE = 45.0;

const states = new Map();

let currentActiveId = null;

// =====================================
// エラー表示
// =====================================

window.addEventListener("error", function(e) {
    debug.textContent =
        "JavaScriptエラー\n" +
        e.message +
        "\n行番号:" + e.lineno;
});

window.addEventListener("unhandledrejection", function(e) {
    debug.textContent =
        "処理エラー\n" + e.reason;
});

// =====================================
// モデル一覧
// =====================================

const spots = [

{id:"castle",name:"新発田城",lat:37.954824724542696,lng:139.326001834219947,model:"shibata_jyo.glb"},

{id:"zousyunkaku",name:"蔵春閣",lat:37.94389807273562,lng:139.3317142467578,model:"Zousyunkaku.glb"},

{id:"sl",name:"東公園のSL",lat:37.94367248807764,lng:139.3323475293261,model:"SL.glb"},

{id:"oumon",name:"王紋酒造",lat:37.94436989072327,lng:139.33066511399528,model:"Oumon.glb"},

{id:"station",name:"新発田駅",lat:37.94413,lng:139.33510,model:"shibata_station.glb"},

{id:"menchi",name:"五十公野メンチカツや",lat:37.93682,lng:139.34488,model:"Menchikatsu.glb"},

{id:"hellotore",name:"新潟職業能力開発短期大学校",lat:37.955482,lng:139.338409,model:"shibata_station.glb"},

{id:"ayamenoyu",name:"あやめの湯",lat:37.953545,lng:139.354947,model:"ayamenoyu.glb"},

{id:"ikunesu",name:"イクネスしばた",lat:37.944357,lng:139.333388,model:"ikunesu_shibata_building.glb"},

{id:"culture-center",name:"カルチャーセンター",lat:37.950246,lng:139.338618,model:"culture_center.glb"},

{id:"parlor-yaoya",name:"パーラーやお家",lat:37.958090796262155,lng:139.34239931165678,model:"parlor_yaoya.glb"},

{id:"bontakeda",name:"ボン・タケダ",lat:37.94039,lng:139.33600,model:"bontakeda_shibata.glb"},

{id:"ino",name:"文化洋食ino",lat:37.96236411397717,lng:139.33428189358867,model:"ino.glb"},

{id:"yasuke",name:"やすけカレー",lat:37.93774827263629,lng:139.33615892651278,model:"yasuke.glb"},

{id:"kamajo",name:"レストラン蒲城",lat:37.9504968436357,lng:139.339474708348,model:"restaurant_kamajo.glb"},

{id:"kikusui",name:"菊水",lat:37.960376479226,lng:139.35429135822383,model:"kikusui_funaguchi_final.glb"},

{id:"ijimino",name:"五十公野公園",lat:37.939869,lng:139.356680,model:"ijimino_park.glb"},

{id:"fukiyakoji",name:"蕗谷虹児記念館",lat:37.951780,lng:139.327276,model:"fukiyakoji.glb"},

{id:"suwa",name:"諏訪神社",lat:37.944214,lng:139.332004,model:"shibata_suwa_shrine_gate.glb"},

{id:"rengaya",name:"コーヒーマリーナ煉瓦屋",lat:37.9490054,lng:139.3244045,model:"rengaya.glb"},

{id:"history-library",name:"新発田歴史図書館",lat:37.951279909157336,lng:139.32774756292181,model:"history_library.glb"}

];

// =====================================
// 自動サイズ調整
// =====================================

function autoScaleModel(entity, modelObject, spot) {

    if (!modelObject) {
        states.set(spot.id, "サイズ取得失敗");
        return;
    }

    // ワールド座標を更新
    entity.object3D.updateMatrixWorld(true);
    modelObject.updateMatrixWorld(true);

    // モデルの大きさを取得
    const box = new THREE.Box3().setFromObject(modelObject);

    const size = new THREE.Vector3();

    box.getSize(size);

    const maxSize = Math.max(
        size.x,
        size.y,
        size.z
    );

    if (!Number.isFinite(maxSize) || maxSize < 0.0001) {

        states.set(spot.id, "サイズ取得失敗");

        console.warn(
            spot.name + ": サイズを取得できません"
        );

        return;
    }

    // 最大寸法を90mにする
    const scale = TARGET_MODEL_SIZE / maxSize;

    // モデル全体を拡大・縮小
    entity.object3D.scale.set(
        scale,
        scale,
        scale
    );

    entity.object3D.updateMatrixWorld(true);

    states.set(
        spot.id,
        "読込成功（自動サイズ調整済み）"
    );

    console.log(
        spot.name,
        "元のサイズ:",
        size.x.toFixed(2),
        size.y.toFixed(2),
        size.z.toFixed(2),
        "調整倍率:",
        scale.toFixed(4)
    );
}

// =====================================
// モデル読み込みイベント
// =====================================

spots.forEach(spot => {

    const entity =
        document.getElementById(`model-${spot.id}`);

    states.set(spot.id, "待機中");

    entity.addEventListener("model-loaded", event => {

        const modelObject =
            event.detail.model ||
            entity.getObject3D("mesh");

        autoScaleModel(
            entity,
            modelObject,
            spot
        );

    });

    entity.addEventListener("model-error", event => {

        states.set(spot.id, "読込失敗");

        console.error(
            spot.name,
            event.detail
        );

    });

});

// =====================================
// GPS距離計算
// =====================================

function rad(v) {
    return v * Math.PI / 180;
}

function distanceMeters(lat1, lng1, lat2, lng2) {

    const R = 6371000;

    const dLat = rad(lat2 - lat1);
    const dLng = rad(lng2 - lng1);

    const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) *
        Math.cos(rad(lat2)) *
        Math.sin(dLng / 2) ** 2;

    return R * 2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );
}

// =====================================
// 最寄りモデルだけ表示
// =====================================

function showOnlyNearestModel(nearest, nearestDistance) {

    const activeId =
        nearestDistance <= ACTIVE_RADIUS
        ? nearest.id
        : null;

    spots.forEach(spot => {

        const entity =
            document.getElementById(`model-${spot.id}`);

        const isActive =
            spot.id === activeId;

        entity.setAttribute("visible", isActive);

        if (isActive && !entity.hasAttribute("gltf-model")) {

            // 読み込み前に倍率を初期化
            entity.object3D.scale.set(1, 1, 1);

            states.set(spot.id, "読み込み中");

            entity.setAttribute(
                "gltf-model",
                spot.model
            );

        } else if (
            !isActive &&
            entity.hasAttribute("gltf-model")
        ) {

            // モデルを削除
            entity.removeAttribute("gltf-model");

            entity.removeObject3D("mesh");

            entity.object3D.scale.set(1, 1, 1);

            states.set(spot.id, "待機中");
        }

    });

    currentActiveId = activeId;

    return activeId;
}

// =====================================
// GPS取得
// =====================================

if (!navigator.geolocation) {

    debug.textContent =
        "このブラウザはGPSに対応していません";

} else if (!window.isSecureContext) {

    debug.textContent =
        "HTTPSでアクセスしてください";

} else {

    debug.textContent =
        "GPS監視を開始しました。\n位置情報を取得中...";

    navigator.geolocation.watchPosition(

        p => {

            const lat = p.coords.latitude;
            const lng = p.coords.longitude;
            const accuracy = p.coords.accuracy;

            let nearest = null;
            let nearestDistance = Infinity;

            // 最寄り地点を検索
            spots.forEach(spot => {

                const d = distanceMeters(
                    lat,
                    lng,
                    spot.lat,
                    spot.lng
                );

                if (d < nearestDistance) {

                    nearestDistance = d;
                    nearest = spot;

                }

            });

            // 最寄りモデルだけ表示
            const activeId =
                showOnlyNearestModel(
                    nearest,
                    nearestDistance
                );

            const active =
                activeId
                ? `${nearest.name} : ${states.get(activeId) || "準備中"}`
                : "300m圏外";

            debug.textContent =
`現在位置
緯度:${lat.toFixed(8)}
経度:${lng.toFixed(8)}
GPS精度:${accuracy.toFixed(1)} m

最寄り:${nearest ? nearest.name : "-"}
距離:${nearestDistance.toFixed(1)} m
設置座標:${nearest ? `${nearest.lat}, ${nearest.lng}` : "-"}

300m以内のモデル
${active}

自動サイズ調整
最大寸法:${TARGET_MODEL_SIZE}m`;

        },

        e => {

            const errors = {

                1: "位置情報の使用が拒否されています",

                2: "現在位置を取得できません",

                3: "GPS取得がタイムアウトしました"

            };

            debug.textContent =
                "GPS取得エラー\n" +
                (errors[e.code] || e.message) +
                "\nエラーコード:" + e.code;

        },

        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }

    );

}

</script>

<script src="ar-ui.js"></script>

</body>
