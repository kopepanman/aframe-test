<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>しばコレ ARラボ - 表示テスト</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #07111f;
  color: #edf6ff;
  font-family: system-ui, "Noto Sans JP", sans-serif;
}

#top {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: calc(12px + env(safe-area-inset-top)) 15px 20px;
  background: linear-gradient(#07111ff0, transparent);
  pointer-events: none;
}

h1 {
  font-size: 17px;
  margin: 0;
}

#info {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 10;
  padding: 14px;
  border: 1px solid #ffffff30;
  border-radius: 14px;
  background: rgba(9, 20, 38, .92);
  font-size: 13px;
  line-height: 1.7;
}

#status {
  color: #9ed8ff;
  font-weight: bold;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #65b5ff;
  color: #061323;
  font: inherit;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="top">
  <h1>⌖ しばコレ ARラボ</h1>
</div>

<div id="info">
  <div id="status">カメラ起動前</div>
  <div id="detail">
    ボタンを押してカメラを起動してください。
  </div>
  <button id="start">カメラを起動</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  renderer="alpha: true; antialias: true; colorManagement: true"
  loading-screen="enabled: false"
  background="color: #000000">

  <a-entity id="cameraRig">
    <a-camera
      id="camera"
      position="0 0 0"
      look-controls="enabled: true"
      wasd-controls="enabled: false">
    </a-camera>

    <a-box
      id="testBox"
      position="0 0 -3"
      width="0.5"
      height="0.5"
      depth="0.5"
      material="shader: flat; color: #00ff00; side: double"
      visible="true">
    </a-box>
  </a-entity>

</a-scene>

<script>
const statusText = document.getElementById('status');
const detail = document.getElementById('detail');
const startButton = document.getElementById('start');

let cameraStream = null;

startButton.addEventListener('click', async () => {
  try {
    statusText.textContent = 'カメラ起動中...';
    detail.textContent = 'カメラの使用を許可してください。';

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      throw new Error(
        'カメラを利用できません。HTTPSでアクセスしてください。'
      );
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' }
      },
      audio: false
    });

    const scene = document.querySelector('a-scene');

    statusText.textContent = 'カメラ許可成功';
    detail.textContent =
      '緑色の立方体が見えるか確認してください。';

    /*
      この版は描画確認専用です。
      GPS配置や実世界の座標固定は行いません。
    */

    if (!scene.hasLoaded) {
      await new Promise(resolve => {
        scene.addEventListener('loaded', resolve, { once: true });
      });
    }

    document.getElementById('testBox').setAttribute(
      'visible',
      'true'
    );

    startButton.textContent = 'カメラ起動済み';

  } catch (error) {
    statusText.textContent = '起動エラー';
    detail.textContent = error.message;
  }
});

window.addEventListener('pagehide', () => {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
  }
});
</script>

</body>
</html>
