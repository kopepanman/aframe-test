<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>しばコレ ARラボ - カメラ表示テスト</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  color: #edf6ff;
  font-family: system-ui, "Noto Sans JP", sans-serif;
}

#top {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
  padding: calc(14px + env(safe-area-inset-top)) 15px 20px;
  background: linear-gradient(#07111fee, transparent);
  pointer-events: none;
}

h1 {
  margin: 0;
  font-size: 17px;
}

#panel {
  position: fixed;
  z-index: 10;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  padding: 13px;
  border: 1px solid #ffffff30;
  border-radius: 15px;
  background: rgba(9, 20, 38, .92);
  font-size: 12px;
  line-height: 1.7;
}

#status {
  color: #9ed8ff;
  font-weight: bold;
}

button {
  width: 100%;
  margin-top: 9px;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #65b5ff;
  color: #061323;
  font: inherit;
  font-weight: bold;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  z-index: 1;
}

a-scene canvas {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 2 !important;
}
</style>
</head>

<body>

<div id="top">
  <h1>⌖ しばコレ ARラボ</h1>
</div>

<div id="panel">
  <div id="status">カメラ起動中...</div>
  <div id="detail">
    カメラの使用を許可してください。映像の上に緑の立方体が表示されるか確認します。
  </div>
  <button id="check">表示状態を確認</button>
</div>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
  renderer="alpha: true; antialias: true; colorManagement: true; logarithmicDepthBuffer: true"
  loading-screen="enabled: false">

  <a-entity id="cameraRig">
    <a-camera
      id="camera"
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-camera>

    <a-box
      id="testBox"
      position="0 0 -3"
      width="0.5"
      height="0.5"
      depth="0.5"
      material="shader: flat; color: #00ff00; side: double"
      visible="true">
    </a-box>
  </a-entity>

</a-scene>

<script>
const statusText = document.getElementById('status');
const detail = document.getElementById('detail');
const scene = document.querySelector('a-scene');

scene.addEventListener('loaded', () => {
  statusText.textContent = '3Dシーン起動済み';
  detail.textContent =
    'カメラ映像と緑の立方体が表示されるか確認してください。';
});

scene.addEventListener('camera-init', () => {
  statusText.textContent = 'カメラ初期化成功';
});

scene.addEventListener('camera-error', () => {
  statusText.textContent = 'カメラエラー';
  detail.textContent =
    'ブラウザのカメラ権限、HTTPS接続、他のアプリによるカメラ使用を確認してください。';
});

document.getElementById('check').addEventListener('click', () => {
  const box = document.getElementById('testBox');
  const renderer = scene.renderer;

  if (!renderer) {
    statusText.textContent = '3D描画準備中';
    detail.textContent =
      '少し待ってからもう一度確認してください。';
    return;
  }

  box.setAttribute('visible', true);

  statusText.textContent = '立方体を表示する設定です';
  detail.textContent =
    '緑の立方体が見え、背景にカメラ映像が表示されるか確認してください。';
});
</script>

</body>
</html>
