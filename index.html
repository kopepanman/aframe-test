<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>しばコレ 3Dモデルビューア</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: sans-serif;
  color: white;
  background: #101521;
}

#viewer {
  position: fixed;
  inset: 0;
  touch-action: none;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#panel {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  z-index: 10;
  padding: 14px;
  border: 1px solid #ffffff24;
  border-radius: 14px;
  background: #111827e8;
  backdrop-filter: blur(8px);
}

h1 {
  margin: 0 0 10px;
  font-size: 18px;
}

label {
  display: block;
  margin: 9px 0 5px;
  font-size: 13px;
  color: #cbd5e1;
}

select, button, input[type="file"] {
  width: 100%;
  min-height: 40px;
  border: 1px solid #475569;
  border-radius: 8px;
  padding: 8px;
  color: white;
  background: #263449;
  font-size: 14px;
}

input[type="range"] {
  width: 100%;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 9px;
}

button {
  cursor: pointer;
}

#status {
  margin-top: 9px;
  font-size: 12px;
  color: #93c5fd;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

#help {
  position: fixed;
  z-index: 5;
  bottom: 14px;
  left: 12px;
  right: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  background: #111827d9;
  color: #e2e8f0;
  font-size: 12px;
  line-height: 1.7;
  pointer-events: none;
}

#togglePanel {
  position: fixed;
  z-index: 20;
  top: 12px;
  right: 12px;
  width: auto;
  display: none;
}

#panel.hidden {
  display: none;
}

#togglePanel.visible {
  display: block;
}
</style>
</head>

<body>

<div id="viewer"></div>

<div id="panel">
  <h1>しばコレ 3Dモデルビューア</h1>

  <label for="modelSelect">モデルを選択</label>
  <select id="modelSelect">
    <option value="Zousyunkaku.glb">蔵春閣</option>
    <option value="hellotore_kun.glb">ハロトレくん</option>
    <option value="shibata_station.glb">新発田駅</option>
    <option value="shibata_suwa_shrine_gate.glb">諏訪神社の鳥居</option>
    <option value="shibatacastle.glb">新発田城</option>
    <option value="hinan.glb">避難誘導サイン</option>
  </select>

  <label for="sizeSlider">モデルの大きさ</label>
  <input id="sizeSlider" type="range" min="0.25" max="3" step="0.05" value="1">

  <div class="buttons">
    <button id="resetBtn">向き・位置をリセット</button>
    <button id="rotateBtn">自動回転：OFF</button>
  </div>

  <label for="fileInput">別のGLBファイルを読み込む</label>
  <input id="fileInput" type="file" accept=".glb,.gltf">

  <div id="status">3D画面を準備しています...</div>
</div>

<button id="togglePanel" class="visible">設定を開く</button>

<div id="help">
  🖱 PC：ドラッグで回転・ホイールで拡大縮小<br>
  📱 スマホ：スワイプで回転・2本指で拡大縮小<br>
  モデルが表示されたら、好きな角度から確認できます。
</div>

<script type="module">
import * as THREE from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { GLTFLoader } from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

import { OrbitControls } from
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const viewer = document.getElementById('viewer');
const status = document.getElementById('status');
const modelSelect = document.getElementById('modelSelect');
const sizeSlider = document.getElementById('sizeSlider');
const fileInput = document.getElementById('fileInput');
const panel = document.getElementById('panel');
const togglePanel = document.getElementById('togglePanel');

let currentModel = null;
let modelCenter = new THREE.Vector3();
let baseScale = 1;
let autoRotate = false;
let loadVersion = 0;
let localObjectURL = null;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101521);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  10000
);
camera.position.set(3, 2.5, 5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enablePan = true;
controls.enableZoom = true;
controls.minDistance = 0.05;
controls.maxDistance = 10000;
controls.target.set(0, 0, 0);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x526078, 2));

const light1 = new THREE.DirectionalLight(0xffffff, 3);
light1.position.set(5, 8, 6);
scene.add(light1);

const light2 = new THREE.DirectionalLight(0x9bc5ff, 1.5);
light2.position.set(-5, 3, -5);
scene.add(light2);

const grid = new THREE.GridHelper(10, 20, 0x53647f, 0x29364a);
grid.position.y = -0.01;
scene.add(grid);

const loader = new GLTFLoader();

function setStatus(message, isError = false) {
  status.textContent = message;
  status.style.color = isError ? '#fca5a5' : '#93c5fd';
}

function disposeModel(model) {
  model.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();

    if (obj.material) {
      const materials = Array.isArray(obj.material)
        ? obj.material
        : [obj.material];

      materials.forEach(material => {
        for (const key in material) {
          const value = material[key];
          if (value && value.isTexture) value.dispose();
        }
        material.dispose();
      });
    }
  });
}

function frameModel(model) {
  const box = new THREE.Box3().setFromObject(model);

  if (box.isEmpty()) {
    throw new Error('モデルに表示可能な形状がありません。');
  }

  const size = box.getSize(new THREE.Vector3());
  modelCenter = box.getCenter(new THREE.Vector3());

  const maxDimension = Math.max(size.x, size.y, size.z);

  if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
    throw new Error('モデルの大きさを取得できませんでした。');
  }

  // モデルの中心を原点に移動し、表示しやすいサイズにそろえる
  model.position.sub(modelCenter);
  baseScale = 2.5 / maxDimension;
  model.scale.setScalar(baseScale);

  // モデル全体が画面に入るようカメラ位置を調整
  const framedSize = size.clone().multiplyScalar(baseScale);
  const maxFramed = Math.max(
    framedSize.x,
    framedSize.y,
    framedSize.z
  );

  const distance = Math.max(
    maxFramed * 2.2,
    2.5
  );

  camera.position.set(
    distance * 0.9,
    distance * 0.65,
    distance * 1.2
  );

  camera.near = Math.max(distance / 10000, 0.001);
  camera.far = Math.max(distance * 100, 1000);
  camera.updateProjectionMatrix();

  controls.target.set(0, 0, 0);
  controls.minDistance = Math.max(maxFramed * 0.05, 0.01);
  controls.maxDistance = Math.max(maxFramed * 100, 100);
  controls.update();

  sizeSlider.value = '1';
}

async function loadModel(url, label, revokeAfter = false) {
  const thisLoad = ++loadVersion;
  setStatus('読み込み中：' + label);

  try {
    const gltf = await loader.loadAsync(url);

    if (thisLoad !== loadVersion) {
      disposeModel(gltf.scene);
      if (revokeAfter) URL.revokeObjectURL(url);
      return;
    }

    if (currentModel) {
      scene.remove(currentModel);
      disposeModel(currentModel);
    }

    currentModel = gltf.scene;
    scene.add(currentModel);
    frameModel(currentModel);

    setStatus('表示成功：' + label);
  } catch (error) {
    console.error(error);

    if (thisLoad === loadVersion) {
      setStatus(
        '読み込み失敗：' + label +
        '。ファイル名・配置・GLB形式を確認してください。' +
        (error.message ? ' 詳細：' + error.message : ''),
        true
      );
    }

    if (revokeAfter) URL.revokeObjectURL(url);
  }
}

modelSelect.addEventListener('change', () => {
  loadModel(modelSelect.value, modelSelect.options[modelSelect.selectedIndex].text);
});

sizeSlider.addEventListener('input', () => {
  if (!currentModel) return;
  currentModel.scale.setScalar(baseScale * Number(sizeSlider.value));
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (currentModel) frameModel(currentModel);
});

document.getElementById('rotateBtn').addEventListener('click', event => {
  autoRotate = !autoRotate;
  controls.autoRotate = autoRotate;
  controls.autoRotateSpeed = 2;
  event.currentTarget.textContent =
    '自動回転：' + (autoRotate ? 'ON' : 'OFF');
});

fileInput.addEventListener('change', event => {
  const file = event.target.files[0];
  if (!file) return;

  if (localObjectURL) URL.revokeObjectURL(localObjectURL);
  localObjectURL = URL.createObjectURL(file);

  loadModel(localObjectURL, file.name, true);
});

togglePanel.addEventListener('click', () => {
  const hidden = panel.classList.toggle('hidden');
  togglePanel.textContent = hidden ? '設定を開く' : '設定を閉じる';
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

// 最初のモデルを自動読み込み
loadModel(
  modelSelect.value,
  modelSelect.options[modelSelect.selectedIndex].text
);
</script>

</body>
</html>
